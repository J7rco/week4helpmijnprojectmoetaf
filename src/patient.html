<!DOCTYPE html>


<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nieuwe patiënt</title>
    <!--    bootstrap-->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!--    bootstrap icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!--    jquery-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!--select2-->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <!--plotly.js-->
    <script src="https://cdn.plot.ly/plotly-3.0.1.min.js" charset="utf-8"></script>
    <!--    local scripts-->
    <!-- <script type="text/javascript" th:src="@{js/database/login.js}"></script>
    <script type="text/javascript" th:src="@{js/database/meting.js}"></script>
    <script type="text/javascript" th:src="@{js/database/arts.js}"></script> -->
    <script type="text/javascript" src="./persoon.js"></script>
    <script type="text/javascript" src="./patient.js"></script>
    <!-- <script type="text/javascript" th:src="@{js/database/behandelCombinatie.js}"></script>
    <script type="text/javascript" th:src="@{js/database/diagnose.js}"></script> -->

    <!--local styles-->
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./form.css">
    <!-- <link rel="stylesheet" th:href="@{css/list.css}"> -->
    <!-- <link rel="stylesheet" th:href="@{css/login.css}"> -->
    <link rel="stylesheet" href="./nav.css">
</head>


<body>
<header>
    <div th:fragment="header" class="header">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="navbar" id="navbarSupportedContent">
                <a class="nav-link nav-logout"></a>
                <a class="nav-link" aria-current="page" href="/patients">Patiënten</a>
                <a class="nav-link" aria-current="page" href="/home"><img th:src="@{AUMC_logo.png}" class="aumc-logo"></a>
                <a class="nav-link" aria-current="page" href="/account">Mijn account</a>
                <a class="nav-link nav-logout" aria-current="page" href="javascript:void(0);" onclick="logout()"><i class="bi bi-box-arrow-right"></i></a>
            </div>
        </nav>
    </div>
</header>
<div id="editPatient">
    <div class="btn-group" role="group" id="patientEditOptionsGroup">
        <button type="button" class="btn" onclick="insertPatient()">Patiënt opslaan</button>
    </div>
</div>


<div id="patient_new_alert" class="row"></div>
<div class="patient-details">
    <form class="row g-3" id="patient-details-form">

        <!-- Naam Gegevens -->

        <div class="col-md-2">
            <label for="inputTitels" class="form-label">Titels</label>
            <input type="text" id="inputTitels" class="form-control">
        </div>

        <div class="col-md-2">
            <label for="inputInitialen" class="form-label">Initialen</label>
            <input type="text" id="inputInitialen" class="form-control">
        </div>

        <div class="col-md-2">
            <label for="inputVoorvoegsels" class="form-label">Voorvoegsels</label>
            <input type="text" id="inputVoorvoegsels" class="form-control">
        </div>

        <div class="col-md-6">
            <label for="inputAchternaam" class="form-label">Achternaam</label>
            <input type="text" id="inputAchternaam" class="form-control" required>
        </div>

        <div class="col-md-6">
            <label for="inputVoornaam" class="form-label">Voornamen</label>
            <input type="text" id="inputVoornaam" class="form-control">
        </div>

        <div class="col-md-6">
            <label for="inputRoepnaam" class="form-label">Roepnaam</label>
            <input type="text" id="inputRoepnaam" class="form-control" required>
        </div>

        <div class="col-md-6 form-filler"></div>

        <!-- Adres gegevens -->

        <div class="col-md-2">
            <label for="inputStraat" class="form-label">Straat</label>
            <input type="text" id="inputStraat" class="form-control">
        </div>

        <div class="col-md-2">
            <label for="inputHuisnummer" class="form-label">Huisnummer</label>
            <input type="text" id="inputHuisnummer" class="form-control">
        </div>

        <div class="col-md-2">
            <label for="inputWoonplaats" class="form-label">Woonplaats</label>
            <input type="text" id="inputWoonplaats" class="form-control">
        </div>

        <div class="col-md-2">
            <label for="inputPostcode" class="form-label">Postcode</label>
            <input type="text" id="inputPostcode" class="form-control" required>
        </div>

        <div class="col-md-6">
            <label for="inputGemeente" class="form-label">Gemeente</label>
            <input type="text" id="inputGemeente" class="form-control" required>
        </div>

        <div class="col-md-6 form-filler"></div>

        <!-- Contact gegevens -->

        <div class="col-md-6">
            <label for="inputEmailadres" class="form-label">Emailadres</label>
            <input type="text" id="inputEmailadres" class="form-control">
        </div>

        <div class="col-md-6">
            <label for="inputTelefoonnummer" class="form-label">Telefoonnummer</label>
            <input type="text" id="inputTelefoonnummer" class="form-control">
        </div>

        <div class="col-md-6 form-filler"></div>

        <!--         Woonsituatie  -->

        <div class="col-md-6">
            <label for="inputWoningdatum" class="form-label">Woningdatum</label>
            <input type="date" id="inputWoningdatum" class="form-control">
        </div>

        <div class="col-md-6">
            <label for="WoningTypeCodelijst" class="form-label">Woning Type</label>
            <select id="WoningTypeCodelijst" class="form-control">
                <option value="" selected disabled hidden>Selecteer woningtype</option>
                <option value="BOVENW">Bovenwoning</option>
                <option value="BENEDENW">Benedenwoning</option>
                <option value="EENGEZW">Eengezinswoning</option>
                <option value="FLATW">Appartement of flatwoning</option>
                <option value="AANLW">Aanleunwoning</option>
                <option value="WOONB">Woonboot</option>
                <option value="WOONW">Woonwagen</option>
                <option value="AWBZIN">Instelling AWBZ</option>
                <option value="WLZIN">Instelling WLZ</option>
                <option value="ZVWIN">Instelling ZVW</option>
                <option value="WMOIN">Instelling WMO</option>
                <option value="AZC">Asielzoekers-centrum</option>
                <option value="DAKLOO">Dakloos</option>
                <option value="OTH">Anders</option>
            </select>
        </div>

        <div class="col-md-6">
            <label for="WoonOmstandigheidCodelijst" class="form-label">Woning Omstandigheid</label>
            <select id="WoonOmstandigheidCodelijst" class="form-control">
                <option value="" selected disabled hidden>Selecteer woningtype</option>
                <option value="160708008">Huis bevat trap</option>
                <option value="609241003">Woont in appartement met lift</option>
                <option value="715758005">Toegang tot woning via trap</option>
                <option value="424948003">Ingang van woning geblokkeerd</option>
                <option value="423155007">Huis bevat structurele belemmering voor verplaatsing	</option>
                <option value="424661000">Rommelige leefruimte</option>
                <option value="424415008">Vieze leefomstandigheden</option>
                <option value="224152001">Houdt huisdieren</option>
                <option value="423527000">Vloerbedekking onveilig</option>
            </select>
        </div>

        <div class="col-md-6">
            <label for="WoningAanpassingCodelijst" class="form-label">Woning Aanpassinglijst</label>
            <select id="WoningAanpassingCodelijst" class="form-control">
                <option value="" selected disabled hidden>Selecteer woningtype</option>
                <option value="467158009">Badstoel en/of douchestoel</option>
                <option value="465153004">Traplift</option>
                <option value="465302005">Aangepast toilet</option>
                <option value="705401004">Aangepast bed</option>
                <option value="705390009">Woningaanpassing</option>
                <option value="360303004">Wandbeugel</option>
            </select>
        </div>

        <div class="col-md-6">
            <label for="inputToelWoning" class="form-label">Toelichting Woning</label>
            <input type="text" id="inputToelWoning" class="form-control">
        </div>

        <div class="col-md-6 form-filler"></div>

<!-- Extra gegevens-->

        <div class="col-md-6 form-filler">
            <input type="number" id="inputPersoonID">
        </div>

        <div class="col-md-6 form-filler">
            <input type="number" id="inputPatientID">
        </div>

        <div class="col-md-6">
            <label for="inputGeslacht" class="form-label">Geslacht</label>
            <select id="inputGeslacht" class="form-control">
                <option value="" selected disabled hidden>Selecteer geslacht</option>
                <option value="M">Man</option>
                <option value="F">Vrouw</option>
                <option value="UN">Anders</option>
            </select>
        </div>

        <div class="col-md-6">
            <label for="inputGebdat" class="form-label">Geboortedatum</label>
            <input type="date" id="inputGebdat" class="form-control">
        </div>

        <div class="col-md-2">
            <label for="inputIQ" class="form-label">IQ</label>
            <input type="number" id="inputIQ" class="form-control">
        </div>

    </form>
</div>


</body>
</html>
